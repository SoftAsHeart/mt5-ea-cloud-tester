name: MT5 Cloud Genetic Optimization

on:
  workflow_dispatch:

jobs:
  run-mt5-tester:
    runs-on: windows-latest # 4 vCPUs, 16 GB RAM
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install Exness MT5 Silently
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5"
          $installer = "C:\MT5\exness5setup.exe"
          $urls = @(
            "https://terminal.free",
            "https://mql5.com",
            "https://terminal.free"
          )

          foreach ($u in $urls) {
            Write-Host "Trying download from: $u"
            curl.exe -L -f -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$u" -o "$installer"
            if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 1000000)) {
              Write-Host "Downloaded valid installer ($([math]::Round((Get-Item $installer).Length / 1MB, 2)) MB)"
              break
            }
          }

          if (-not (Test-Path $installer) -or ((Get-Item $installer).Length -le 1000000)) {
            throw "Failed to download a valid MT5 installer."
          }

          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait

          # Wait up to 60s for background installer child process to finish writing terminal64.exe
          $installDir = $null
          for ($i = 0; $i -lt 30; $i++) {
            $found = Get-ChildItem "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $installDir = $found.DirectoryName
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $installDir) {
            throw "MT5 installation directory not found under C:\Program Files."
          }

          Write-Host "Found installed MT5 at: $installDir"
          Start-Sleep -Seconds 3
          Copy-Item "$installDir\*" -Destination "C:\MT5\" -Recurse -Force

      - name: Copy EA, Config & Inject Exness Demo Secrets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path "C:\MT5\config"
          New-Item -ItemType Directory -Force -Path "C:\MT5\reports"
          Copy-Item "MQL5\Experts\*.ex5" -Destination "C:\MT5\MQL5\Experts\" -Force

          $content = Get-Content "config\optimize.ini"
          $content = $content -replace "DEMO_LOGIN_PLACEHOLDER", "${{ secrets.EXNESS_DEMO_LOGIN }}"
          $content = $content -replace "DEMO_PASS_PLACEHOLDER", "${{ secrets.EXNESS_DEMO_PASS }}"
          $content = $content -replace "Exness-MT5Trial8", "${{ secrets.EXNESS_DEMO_SERVER }}"
          Set-Content "C:\MT5\config\optimize.ini" $content

      - name: Run MT5 Strategy Tester (Headless 4-Core)
        shell: powershell
        run: |
          Write-Host "Starting MT5 Optimization on 4 vCPUs..."
          $proc = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/config:`"C:\MT5\config\optimize.ini`"" -PassThru -Wait
          Write-Host "MT5 exited with code: $($proc.ExitCode)"

      - name: Upload Optimization Reports & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-optimization-results
          path: |
            C:\MT5\reports\
            C:\MT5\Tester\logs\
            C:\MT5\Logs\
          if-no-files-found: warn
