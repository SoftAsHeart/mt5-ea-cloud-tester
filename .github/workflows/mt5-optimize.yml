name: MT5 Cloud Genetic Optimization

on:
  workflow_dispatch:

jobs:
  run-mt5-tester:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download MT5 Binaries & Profile from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5"
          gh release download mt5-binaries --dir "C:\MT5"
          Get-ChildItem "C:\MT5" -Filter "*.zip" | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath "C:\MT5" -Force
          }
          Get-ChildItem "C:\MT5" -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -ne "C:\MT5" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\MT5\" -Force
          }
          Get-ChildItem "C:\MT5" -Directory -Recurse | Where-Object { $_.Name -in @("Config", "Bases") -and $_.Parent.FullName -ne "C:\MT5" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\MT5\" -Recurse -Force
          }
          Write-Host "Root contents of C:\MT5:"
          Get-ChildItem "C:\MT5"

      - name: Prepare Config & Inject Exness Secrets
        env:
          DEMO_LOGIN: ${{ secrets.EXNESS_DEMO_LOGIN }}
          DEMO_PASS: ${{ secrets.EXNESS_DEMO_PASS }}
          DEMO_SERVER: ${{ secrets.EXNESS_DEMO_SERVER }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Profiles\Tester"
          New-Item -ItemType Directory -Force -Path "C:\MT5\Config"
          New-Item -ItemType Directory -Force -Path "C:\MT5\reports"

          # Recursively find all .ex5 files anywhere in the repo and copy to MT5 Experts
          Get-ChildItem -Path "." -Recurse -Filter "*.ex5" | Copy-Item -Destination "C:\MT5\MQL5\Experts\" -Force
          Write-Host "EX5 files copied to C:\MT5\MQL5\Experts:"
          Get-ChildItem "C:\MT5\MQL5\Experts\*.ex5"

          # Recursively find all .set files anywhere in the repo and convert to UTF-16 LE in Tester profile
          Get-ChildItem -Path "." -Recurse -Filter "*.set" | ForEach-Object {
            Get-Content $_.FullName | Set-Content -Path "C:\MT5\MQL5\Profiles\Tester\$($_.Name)" -Encoding Unicode
          }
          Write-Host "SET files copied to C:\MT5\MQL5\Profiles\Tester:"
          Get-ChildItem "C:\MT5\MQL5\Profiles\Tester\*.set"

          $login = $env:DEMO_LOGIN.Trim()
          $pass = $env:DEMO_PASS.Trim()
          $server = $env:DEMO_SERVER.Trim()

          $warmLines = @("[Common]", "Login=$login", "Password=$pass", "Server=$server", "KeepPrivate=1", "NewsEnable=0")
          $warmLines | Set-Content "C:\MT5\Config\warmup.ini"

          Write-Host "Pre-warming Exness login on server: [$server]..."
          $warm = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/skipupdate", "/config:`"C:\MT5\Config\warmup.ini`"" -PassThru
          Start-Sleep -Seconds 25
          if (-not $warm.HasExited) {
            Stop-Process -Id $warm.Id -Force
            Start-Sleep -Seconds 3
          }

          $lines = Get-Content "config\optimize.ini"
          $out = foreach ($line in $lines) {
            if ($line -match "^Login=") { "Login=$login" }
            elseif ($line -match "^Password=") { "Password=$pass" }
            elseif ($line -match "^Server=") { "Server=$server" }
            else { $line }
          }
          $out | Set-Content "C:\MT5\Config\optimize.ini"

          Write-Host "--- Verified Config (Password Masked) ---"
          $out | Where-Object { $_ -notmatch "^Password=" } | Write-Host

      - name: Run MT5 Strategy Tester (Headless 4-Core)
        shell: powershell
        run: |
          Write-Host "Starting MT5 Strategy Tester..."
          $proc = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/skipupdate", "/config:`"C:\MT5\Config\optimize.ini`"" -PassThru -Wait
          Write-Host "MT5 exited with code: $($proc.ExitCode)"

          Get-ChildItem "C:\MT5" -Filter "Report*.xml" -ErrorAction SilentlyContinue | Copy-Item -Destination "C:\MT5\reports\" -Force
          Write-Host "Reports collected in C:\MT5\reports:"
          Get-ChildItem "C:\MT5\reports\"

      - name: Upload Optimization Reports & Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mt5-optimization-results
          path: |
            C:\MT5\reports\
            C:\MT5\Tester\logs\
            C:\MT5\Logs\
          if-no-files-found: warn
