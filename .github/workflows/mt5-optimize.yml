name: MT5 Dual-EA Walk-Forward Optimization

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MQL5/Experts/**'
      - 'config/**'
      - '.github/workflows/mt5-optimize.yml'

jobs:
  optimize-backtest:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache Base MetaTrader 5 Installation
        id: cache-mt5
        uses: actions/cache@v4
        with:
          path: .\MT5\terminal64.exe
          key: mt5-terminal-base-v1

      - name: Download & Install Portable MetaTrader 5
        if: steps.cache-mt5.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\MT5" | Out-Null
          $installerUrl = "https://mql5.com"
          Invoke-WebRequest -Uri $installerUrl -OutFile ".\mt5setup.exe"
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto /path:$((Resolve-Path '.\MT5').Path)" -Wait
          Remove-Item ".\mt5setup.exe" -Force -ErrorAction SilentlyContinue

      - name: Prepare Portable Directories & Copy Repo Files
        shell: powershell
        run: |
          $dirs = @(
            ".\MT5\MQL5\Experts",
            ".\MT5\MQL5\Presets",
            ".\MT5\MQL5\Profiles\Tester",
            ".\MT5\config",
            ".\MT5\reports",
            ".\reports"
          )
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }

          Copy-Item -Path ".\MQL5\Experts\*.ex5" -Destination ".\MT5\MQL5\Experts\" -Force
          Copy-Item -Path ".\MQL5\Experts\*.set" -Destination ".\MT5\MQL5\Presets\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path ".\MQL5\Experts\*.set" -Destination ".\MT5\MQL5\Experts\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path ".\MQL5\Experts\*.set" -Destination ".\MT5\MQL5\Profiles\Tester\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path ".\config\*" -Destination ".\MT5\config\" -Recurse -Force

          Write-Host "=== Loaded Experts ==="
          Get-ChildItem ".\MT5\MQL5\Experts\*.ex5" | Select-Object Name, Length, LastWriteTime

      - name: Run Walk-Forward Optimization 1 (mytrader50)
        shell: powershell
        run: |
          if (Test-Path ".\MT5\config\optimize.ini") {
            Write-Host "Starting mytrader50 optimization..."
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            Start-Process -FilePath ".\MT5\terminal64.exe" -ArgumentList "/portable /config:config\optimize.ini" -WorkingDirectory ".\MT5" -Wait
            $sw.Stop()
            Write-Host "mytrader50 finished in $($sw.Elapsed.ToString('mm\:ss'))"
            Get-Process -Name "metatester64" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "config\optimize.ini not found, skipping mytrader50."
          }

      - name: Run Walk-Forward Optimization 2 (GoldTitanHybrid)
        shell: powershell
        run: |
          if (Test-Path ".\MT5\config\optimize_titan.ini") {
            Write-Host "Starting GoldTitanHybrid optimization..."
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            Start-Process -FilePath ".\MT5\terminal64.exe" -ArgumentList "/portable /config:config\optimize_titan.ini" -WorkingDirectory ".\MT5" -Wait
            $sw.Stop()
            Write-Host "GoldTitanHybrid finished in $($sw.Elapsed.ToString('mm\:ss'))"
            Get-Process -Name "metatester64" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "config\optimize_titan.ini not found, skipping GoldTitanHybrid."
          }

      - name: Collect All Generated Reports & Tester Logs
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Path ".\MT5" -Recurse -Include "*.xml","*.htm","*.html","*.png" |
            Where-Object { $_.FullName -match "reports" -or $_.Name -match "Report_" } |
            Copy-Item -Destination ".\reports\" -Force

          Get-ChildItem -Path ".\MT5\Tester\logs" -Filter "*.log" -ErrorAction SilentlyContinue |
            Copy-Item -Destination ".\reports\" -Force

          $files = Get-ChildItem -Path ".\reports\"
          "## MT5 Walk-Forward Optimization Artifacts" >> $env:GITHUB_STEP_SUMMARY
          if ($files.Count -gt 0) {
            "| File Name | Size (KB) |" >> $env:GITHUB_STEP_SUMMARY
            "| :--- | :--- |" >> $env:GITHUB_STEP_SUMMARY
            foreach ($f in $files) {
              $kb = [math]::Round($f.Length / 1KB, 1)
              "| $($f.Name) | $kb KB |" >> $env:GITHUB_STEP_SUMMARY
            }
          } else {
            "⚠️ No report files were generated. Check Tester logs for details." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Optimization Reports Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: MT5-WalkForward-Reports-${{ github.run_number }}
          path: .\reports\
          retention-days: 30
          compression-level: 6
