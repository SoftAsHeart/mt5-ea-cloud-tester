name: MT97 AI Quantum 7-Pair Tester & Optimizer

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Mode: backtest (single-pass 7-pair validation) or optimize (genetic + 1/3 forward)"
        required: true
        default: "backtest"
        type: choice
        options:
          - backtest
          - optimize
      date_from:
        description: "Test Start Date (YYYY.MM.DD)"
        required: true
        default: "2026.05.01"
      date_to:
        description: "Test End Date (YYYY.MM.DD)"
        required: true
        default: "2026.11.27"
      model_mode:
        description: "Tick Model: 1 = 1-Min OHLC (Fast), 4 = Real Ticks (Exact)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "4"

jobs:
  run-mt5-matrix:
    name: ${{ matrix.symbol }} (${{ github.event.inputs.run_mode }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: USDJPYm
            ini: mt97_usdjpy.ini
            preset: MT97_USDJPY_M5.set
          - symbol: EURUSDm
            ini: mt97_eurusd.ini
            preset: MT97_EURUSD_M5.set
          - symbol: USDCADm
            ini: mt97_usdcad.ini
            preset: MT97_USDCAD_M5.set
          - symbol: AUDJPYm
            ini: mt97_audjpy.ini
            preset: MT97_AUDJPY_M5.set
          - symbol: EURJPYm
            ini: mt97_eurjpy.ini
            preset: MT97_EURJPY_M5.set
          - symbol: GBPUSDm
            ini: mt97_gbpusd.ini
            preset: MT97_GBPUSD_M5.set
          - symbol: XAUUSDm
            ini: mt97_xauusd.ini
            preset: MT97_XAUUSD_M5.set

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download MT5 Binaries & Profile from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5"
          gh release download mt5-binaries --dir "C:\MT5"
          Get-ChildItem "C:\MT5" -Filter "*.zip" | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath "C:\MT5" -Force
          }
          Get-ChildItem "C:\MT5" -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -ne "C:\MT5" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\MT5\" -Force
          }
          Get-ChildItem "C:\MT5" -Directory -Recurse | Where-Object { $_.Name -in @("Config", "Bases") -and $_.Parent.FullName -ne "C:\MT5" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\MT5\" -Recurse -Force
          }

      - name: Stage EX5, Warmup Exness & Build Tester INI
        env:
          DEMO_LOGIN: ${{ secrets.EXNESS_DEMO_LOGIN }}
          DEMO_PASS: ${{ secrets.EXNESS_DEMO_PASS }}
          DEMO_SERVER: ${{ secrets.EXNESS_DEMO_SERVER }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Presets"
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Profiles\Tester"
          New-Item -ItemType Directory -Force -Path "C:\MT5\Config"
          New-Item -ItemType Directory -Force -Path "C:\MT5\reports"

          # Copy pre-compiled .ex5 (and compile .mq5 only if .ex5 is missing)
          Get-ChildItem -Path "MQL5\Experts" -Filter "MyTrader97_AITurbo.*" | Copy-Item -Destination "C:\MT5\MQL5\Experts\" -Force
          if (-not (Test-Path "C:\MT5\MQL5\Experts\MyTrader97_AITurbo.ex5") -and (Test-Path "C:\MT5\metaeditor64.exe") -and (Test-Path "C:\MT5\MQL5\Experts\MyTrader97_AITurbo.mq5")) {
            & "C:\MT5\metaeditor64.exe" /compile:"C:\MT5\MQL5\Experts\MyTrader97_AITurbo.mq5" /log:"C:\MT5\reports\compile_v97.log"
            Start-Sleep -Seconds 3
            Get-Content "C:\MT5\reports\compile_v97.log"
          }
          if (-not (Test-Path "C:\MT5\MQL5\Experts\MyTrader97_AITurbo.ex5")) {
            throw "MyTrader97_AITurbo.ex5 missing or compilation failed!"
          }

          # Copy .set preset into Presets and Tester Profiles
          Copy-Item "MQL5\Experts\${{ matrix.preset }}" "C:\MT5\MQL5\Presets\${{ matrix.preset }}" -Force
          Copy-Item "MQL5\Experts\${{ matrix.preset }}" "C:\MT5\MQL5\Profiles\Tester\${{ matrix.preset }}" -Force

          $login  = $env:DEMO_LOGIN.Trim()
          $pass   = $env:DEMO_PASS.Trim()
          $server = $env:DEMO_SERVER.Trim()

          # 25-second Exness broker warmup (syncs symbol specs, contract sizes & servers)
          @("[Common]", "Login=$login", "Password=$pass", "Server=$server", "KeepPrivate=1", "NewsEnable=0") | Set-Content "C:\MT5\Config\warmup.ini"
          $warm = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/skipupdate", "/config:`"C:\MT5\Config\warmup.ini`"" -PassThru
          Start-Sleep -Seconds 25
          if (-not $warm.HasExited) { Stop-Process -Id $warm.Id -Force; Start-Sleep -Seconds 3 }

          # Build run.ini from your Config\mt97_*.ini with credentials & mode flags
          $optFlag = if ("${{ github.event.inputs.run_mode }}" -eq "optimize") { "2" } else { "0" }
          $fwdFlag = if ("${{ github.event.inputs.run_mode }}" -eq "optimize") { "2" } else { "0" }
          $baseIni = Get-Content "Config\${{ matrix.ini }}"

          $commonHeader = @(
            "[Common]",
            "Login=$login",
            "Password=$pass",
            "Server=$server",
            "KeepPrivate=1",
            "NewsEnable=0"
          )

          $outBody = foreach ($line in $baseIni) {
            if ($line -match "^Login=") { "Login=$login" }
            elseif ($line -match "^Password=") { "Password=$pass" }
            elseif ($line -match "^Server=") { "Server=$server" }
            elseif ($line -match "^Symbol=") { "Symbol=${{ matrix.symbol }}" }
            elseif ($line -match "^FromDate=") { "FromDate=${{ github.event.inputs.date_from }}" }
            elseif ($line -match "^ToDate=") { "ToDate=${{ github.event.inputs.date_to }}" }
            elseif ($line -match "^Model=") { "Model=${{ github.event.inputs.model_mode }}" }
            elseif ($line -match "^Optimization=") { "Optimization=$optFlag" }
            elseif ($line -match "^ForwardMode=") { "ForwardMode=$fwdFlag" }
            elseif ($line -match "^ExpertParameters=") { "ExpertParameters=${{ matrix.preset }}" }
            elseif ($line -match "^Report=") { "Report=reports\mt97_${{ matrix.symbol }}.htm" }
            else { $line }
          }

          ($commonHeader + $outBody) | Set-Content "C:\MT5\Config\run_${{ matrix.symbol }}.ini"

      - name: Run MT5 Strategy Tester (${{ matrix.symbol }})
        shell: powershell
        run: |
          Write-Host "=== Running MT97 Quantum (${{ github.event.inputs.run_mode }}) for ${{ matrix.symbol }} ==="
          $proc = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/skipupdate", "/config:`"C:\MT5\Config\run_${{ matrix.symbol }}.ini`"" -PassThru -Wait
          Write-Host "${{ matrix.symbol }} exited with code: $($proc.ExitCode)"
          Get-Process -Name "metatester64" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          Get-ChildItem "C:\MT5" -Filter "*.xml" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination "C:\MT5\reports\" -Force
          Get-ChildItem "C:\MT5\reports\"

      - name: Parse Results & Append to GitHub Summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path "MQL5\Experts\parse_mt97_results.py") {
            python MQL5/Experts/parse_mt97_results.py "${{ matrix.symbol }}" "C:\MT5\reports"
          }

      - name: Upload Symbol Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MT97-${{ matrix.symbol }}-Reports
          path: |
            C:\MT5\reports\
            C:\MT5\Tester\logs\
          if-no-files-found: warn
