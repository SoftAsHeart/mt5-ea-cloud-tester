name: MT5 Walk-Forward Optimization (MyTrader80 EURUSDc)

on:
  workflow_dispatch:
  push:
    paths:
      - 'MQL5/Experts/MyTrader80_ScalpHedge.mq5'
      - 'config/optimize.ini'
      - '.github/workflows/mt5_walkforward.yml'

jobs:
  optimize-mt80:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository (with Pre-Packed Exness MT5)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Exness MT5 Terminal from Repository Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5"
          
          # 1. If the Exness MT5 pack was uploaded as a .zip file, extract it to C:\MT5
          $zip = Get-ChildItem -Path "." -Filter "*.zip" -Recurse | Select-Object -First 1
          if ($zip) {
            Write-Host "Extracting MT5 pack: $($zip.FullName)"
            Expand-Archive -Path $zip.FullName -DestinationPath "C:\MT5" -Force
          }

          # 2. Locate terminal64.exe (either extracted or already uncompressed in repo)
          $term = Get-ChildItem -Path "C:\MT5", "." -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $term) {
            throw "terminal64.exe not found! Ensure the Exness MT5 folder or zip is committed in the repo."
          }

          $mt5Root = $term.DirectoryName
          Write-Host "Found MT5 Terminal Root at: $mt5Root"
          echo "MT5_ROOT=$mt5Root" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path "$mt5Root\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path "$mt5Root\reports"

      - name: Copy EA & Inject Secrets into optimize.ini
        shell: pwsh
        env:
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASS: ${{ secrets.EXNESS_PASS }}
        run: |
          $mt5Root = $env:MT5_ROOT
          
          # Copy Expert Advisor
          $ea = Get-ChildItem -Path "." -Filter "MyTrader80_ScalpHedge.mq5" -Recurse | Select-Object -First 1
          if (-not $ea) { throw "MyTrader80_ScalpHedge.mq5 not found in repository!" }
          Copy-Item $ea.FullName "$mt5Root\MQL5\Experts\MyTrader80_ScalpHedge.mq5" -Force

          # Copy any pre-uploaded Exness account/server config files (*.dat / servers.dat / accounts.dat) if present
          Get-ChildItem -Path "." -Include "accounts.dat","servers.dat" -Recurse | ForEach-Object {
            New-Item -ItemType Directory -Force -Path "$mt5Root\Config"
            Copy-Item $_.FullName "$mt5Root\Config\$($_.Name)" -Force
            Write-Host "Copied account/server file: $($_.Name)"
          }

          # Prepare optimize.ini (inject secrets if configured, or keep pre-packed account login)
          $ini = Get-Content "config\optimize.ini" -Raw
          if ($env:EXNESS_LOGIN) { $ini = $ini.Replace('${{ secrets.EXNESS_LOGIN }}', $env:EXNESS_LOGIN) }
          if ($env:EXNESS_PASS)  { $ini = $ini.Replace('${{ secrets.EXNESS_PASS }}', $env:EXNESS_PASS) }
          Set-Content -Path "$mt5Root\optimize.ini" -Value $ini

      - name: Compile MyTrader80_ScalpHedge.mq5 via MetaEditor
        shell: pwsh
        run: |
          $mt5Root = $env:MT5_ROOT
          $metaeditor = Get-ChildItem -Path $mt5Root -Filter "metaeditor64.exe" -Recurse | Select-Object -First 1
          if (-not $metaeditor) { throw "metaeditor64.exe not found inside $mt5Root!" }

          & $metaeditor.FullName /compile:"$mt5Root\MQL5\Experts\MyTrader80_ScalpHedge.mq5" /log:"$mt5Root\compile.log"
          Start-Sleep -Seconds 5
          Get-Content "$mt5Root\compile.log"

          if (-not (Test-Path "$mt5Root\MQL5\Experts\MyTrader80_ScalpHedge.ex5")) {
            throw "Compilation failed! Check compile.log above."
          }

      - name: Run 24-Month Walk-Forward Optimization
        shell: pwsh
        run: |
          $mt5Root = $env:MT5_ROOT
          Start-Process -FilePath "$mt5Root\terminal64.exe" -ArgumentList "/portable", "/config:$mt5Root\optimize.ini" -Wait

      - name: Collect & Upload Optimization Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyTrader80-EURUSDc-WalkForward-Reports
          path: |
            ${{ env.MT5_ROOT }}\reports\*
            ${{ env.MT5_ROOT }}\compile.log
            ${{ env.MT5_ROOT }}\Tester\logs\*.log
          retention-days: 30
