name: MT5 Quantum Turbo Batch-3 Crosses & Gold Walk-Forward

on:
  workflow_dispatch:

jobs:
  run-mt5-tester:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download MT5 Binaries & Profile from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5"
          gh release download mt5-binaries --dir "C:\MT5"
          Get-ChildItem "C:\MT5" -Filter "*.zip" | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath "C:\MT5" -Force
          }
          Get-ChildItem "C:\MT5" -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -ne "C:\MT5" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\MT5\" -Force
          }
          Get-ChildItem "C:\MT5" -Directory -Recurse | Where-Object { $_.Name -in @("Config", "Bases") -and $_.Parent.FullName -ne "C:\MT5" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "C:\MT5\" -Recurse -Force
          }

      - name: Compile EA, Warmup Exness & Generate Batch-3 Configs
        env:
          DEMO_LOGIN: ${{ secrets.EXNESS_DEMO_LOGIN }}
          DEMO_PASS: ${{ secrets.EXNESS_DEMO_PASS }}
          DEMO_SERVER: ${{ secrets.EXNESS_DEMO_SERVER }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path "C:\MT5\Config"
          New-Item -ItemType Directory -Force -Path "C:\MT5\reports"

          Get-ChildItem -Path "." -Recurse -Filter "MyTrader95_TurboDSP.*" | Copy-Item -Destination "C:\MT5\MQL5\Experts\" -Force
          if ((Test-Path "C:\MT5\metaeditor64.exe") -and (Test-Path "C:\MT5\MQL5\Experts\MyTrader95_TurboDSP.mq5")) {
            & "C:\MT5\metaeditor64.exe" /compile:"C:\MT5\MQL5\Experts\MyTrader95_TurboDSP.mq5" /log:"C:\MT5\reports\compile_v95.log"
            Start-Sleep -Seconds 3
            Get-Content "C:\MT5\reports\compile_v95.log"
          }
          if (-not (Test-Path "C:\MT5\MQL5\Experts\MyTrader95_TurboDSP.ex5")) {
            throw "MyTrader95_TurboDSP.ex5 missing or compilation failed!"
          }

          $login  = $env:DEMO_LOGIN.Trim()
          $pass   = $env:DEMO_PASS.Trim()
          $server = $env:DEMO_SERVER.Trim()

          @("[Common]", "Login=$login", "Password=$pass", "Server=$server", "KeepPrivate=1", "NewsEnable=0") | Set-Content "C:\MT5\Config\warmup.ini"
          $warm = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/skipupdate", "/config:`"C:\MT5\Config\warmup.ini`"" -PassThru
          Start-Sleep -Seconds 25
          if (-not $warm.HasExited) { Stop-Process -Id $warm.Id -Force; Start-Sleep -Seconds 3 }

          $baseIni = Get-Content "config\optimize.ini"
          $pairs = @("USDCHFc", "NZDJPYc", "AUDCADc", "EURCADc", "NZDUSDc", "XAUUSDc")
          foreach ($sym in $pairs) {
            $out = foreach ($line in $baseIni) {
              if ($line -match "^Login=") { "Login=$login" }
              elseif ($line -match "^Password=") { "Password=$pass" }
              elseif ($line -match "^Server=") { "Server=$server" }
              elseif ($line -match "^Symbol=") { "Symbol=$sym" }
              elseif ($line -match "^Report=") { "Report=reports\opt_b3_$sym.htm" }
              elseif ($line -match "^InpMaxSpreadPoints=") { "InpMaxSpreadPoints=35||35||5||35||N" }
              else { $line }
            }
            $out | Set-Content "C:\MT5\Config\opt_$sym.ini"
          }

      - name: Run Batch-3 6-Pair 12-Month Walk-Forward Optimizations
        shell: powershell
        run: |
          $pairs = @("USDCHFc", "NZDJPYc", "AUDCADc", "EURCADc", "NZDUSDc", "XAUUSDc")
          foreach ($sym in $pairs) {
            Write-Host "=== Running 12-Month Quantum Turbo Optimization for $sym ==="
            $proc = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/skipupdate", "/config:`"C:\MT5\Config\opt_$sym.ini`"" -PassThru -Wait
            Write-Host "$sym exited with code: $($proc.ExitCode)"
            Get-Process -Name "metatester64" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }
          Get-ChildItem "C:\MT5" -Filter "*.xml" -ErrorAction SilentlyContinue | Copy-Item -Destination "C:\MT5\reports\" -Force
          Get-ChildItem "C:\MT5\reports\"

      - name: Upload Batch-3 Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MyTrader95-Batch3-Crosses-Gold-Reports
          path: |
            C:\MT5\reports\
            C:\MT5\Tester\logs\
          if-no-files-found: warn
